[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mritorch"
version = "0.0.1"
dependencies = [
  "torch >= 2.2",
  "numpy >= 1.26",
  # torch 2.2.2 is the last release for Intel Macs and was built against NumPy 1.x
  "numpy < 2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
authors = [
  { name="Samuel I. Adams-Tew", email="samuel.adams@utah.edu" },
]
description = "A physics-informed PyTorch library for quantitative MRI"
keywords = ["MRI", "PyTorch", "physics-informed", "quantitative MRI"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/fuslab-uofu/MRITorch"

[project.optional-dependencies]
ismrmrd = ["ismrmrd >= 1.15", "h5py >= 3.16"]
nifti = ["nibabel >= 5.4"]
mat = ["scipy >= 1.17", "h5py >= 3.16"]
nufft = [
  "finufft",
  # finufft 2.5 has no Intel-Mac wheel and fails to build from source there
  "finufft < 2.5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
all = ["mritorch[ismrmrd,nifti,mat,nufft]"]

[dependency-groups]
dev = ["pytest", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mritorch*"]
