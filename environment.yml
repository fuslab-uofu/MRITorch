# Optional: the siemens_to_ismrmrd converter (Siemens twix .dat -> ISMRMRD),
# a C++ tool that pip cannot install. MRITorch itself is installed with pip;
# it only calls this converter as a subprocess.
#
#   conda create -n siemens2ismrmrd --no-default-packages --yes
#   conda env update -n siemens2ismrmrd -f environment.yml
#
# (Creating the env empty first keeps out any create_default_packages from
# .condarc; they pull in a Python too new for the converter's Boost, and
# `conda env create -f environment.yml` then fails.) Then set
# MRITORCH_SIEMENS_TO_ISMRMRD to the converter's path, as described under
# "Siemens raw data" in the README.
name: siemens2ismrmrd
channels:
  - conda-forge
  - ismrmrd
dependencies:
  - ismrmrd::siemens_to_ismrmrd>=1.2.13
  # siemens_to_ismrmrd 1.2.13 links libismrmrd.so.1.14 but only requires
  # ismrmrd>=1.14.2, so pin the C++ library or the converter fails to load
  - ismrmrd::ismrmrd=1.14.*
